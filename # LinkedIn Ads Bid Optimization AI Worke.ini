### WF-2: Get Ad Campaigns for Group

**Purpose:** Fetches all active campaigns nested under a single campaign group. Resolves budget configuration and bid strategy for each campaign.

**Inputs:**
```json
{
  "groupId": "string",
  "groupUrn": "string",
  "groupName": "string",
  "groupBudgetType": "DAILY | LIFETIME | UNCAPPED",
  "groupDailyBudget": "number | null",
  "groupLifetimeBudget": "number | null",
  "groupBudgetCurrency": "string | null",
  "groupScheduleEnd": "string | null",
  "accountId": "string",
  "accessToken": "string"
}
```

**API Call:**
```
GET https://api.linkedin.com/rest/adAccounts/{accountId}/adCampaigns
  ?q=search
  &search.campaignGroup.values[0]={groupUrn}
  &search.status.values[0]=ACTIVE
  &fields=id,name,status,objectiveType,unitCost,bidOptimizationTarget,
          costType,dailyBudget,totalBudget,pacingStrategy,campaignGroup,
          type,locale,runSchedule,optimizationTargetType,
          leadGenerationFormEnabled
  &count=100
```

**Headers:** Same as WF-1.

**Pagination:** Same pattern as WF-1. Check `paging.total`.

**Budget resolution logic:**
```javascript
function resolveCampaignBudget(campaign) {
  const hasDaily    = !!campaign.dailyBudget?.amount
  const hasLifetime = !!campaign.totalBudget?.amount

  if (hasDaily && hasLifetime) return {
    budgetType:     "DAILY_AND_LIFETIME",
    dailyBudget:    campaign.dailyBudget.amount,
    lifetimeBudget: campaign.totalBudget.amount,
    currency:       campaign.dailyBudget.currencyCode
  }
  if (hasDaily) return {
    budgetType:     "DAILY",
    dailyBudget:    campaign.dailyBudget.amount,
    lifetimeBudget: null,
    currency:       campaign.dailyBudget.currencyCode
  }
  if (hasLifetime) return {
    budgetType:     "LIFETIME",
    dailyBudget:    null,
    lifetimeBudget: campaign.totalBudget.amount,
    currency:       campaign.totalBudget.currencyCode
  }
  return {
    budgetType:     "INHERITED",
    dailyBudget:    null,
    lifetimeBudget: null,
    currency:       null
  }
}
```

**Bid strategy resolution logic:**
```javascript
function resolveBidStrategy(campaign) {
  const target   = campaign.bidOptimizationTarget
  const costType = campaign.costType
  const hasBid   = !!campaign.unitCost?.amount

  // MAX DELIVERY — no unit cost set, LinkedIn controls bidding
  if (!hasBid) return {
    bidStrategy: "MAX_DELIVERY",
    bidType:     costType || "CPM",
    bidAmount:   null,
    bidCap:      null
  }

  // MANUAL BID — advertiser sets exact bid
  if (target === "MAX_CLICK") return {
    bidStrategy: "MANUAL_BID",
    bidType:     "CPC",
    bidAmount:   campaign.unitCost.amount,
    bidCap:      null
  }
  if (target === "MAX_IMPRESSION") return {
    bidStrategy: "MANUAL_BID",
    bidType:     "CPM",
    bidAmount:   campaign.unitCost.amount,
    bidCap:      null
  }
  if (target === "MAX_VIDEO_VIEW") return {
    bidStrategy: "MANUAL_BID",
    bidType:     "CPV",
    bidAmount:   campaign.unitCost.amount,
    bidCap:      null
  }

  // COST CAP — unit cost is the maximum average cost target
  if (target === "TARGET_COST_PER_CLICK") return {
    bidStrategy: "COST_CAP",
    bidType:     "CPC",
    bidAmount:   null,
    bidCap:      campaign.unitCost.amount
  }
  if (target === "TARGET_COST_PER_IMPRESSION") return {
    bidStrategy: "COST_CAP",
    bidType:     "CPM",
    bidAmount:   null,
    bidCap:      campaign.unitCost.amount
  }

  // TARGET COST — LinkedIn tries to hit the avg cost target
  if (target === "ENHANCED_CONVERSION") return {
    bidStrategy: "TARGET_COST",
    bidType:     "CPC",
    bidAmount:   null,
    bidCap:      campaign.unitCost.amount
  }

  // ENHANCED CPC — manual CPC with LinkedIn micro-adjustments
  if (target === "ENHANCED_CPC") return {
    bidStrategy: "ENHANCED_CPC",
    bidType:     "CPC",
    bidAmount:   campaign.unitCost.amount,
    bidCap:      null
  }

  // Fallback
  return {
    bidStrategy: "MAX_DELIVERY",
    bidType:     costType || "CPM",
    bidAmount:   null,
    bidCap:      null
  }
}
```

**Lead gen form detection:**
```javascript
function resolveLeadGen(campaign) {
  // Explicit field first
  if (typeof campaign.leadGenerationFormEnabled === "boolean")
    return campaign.leadGenerationFormEnabled
  // Infer from objective
  if (campaign.objectiveType === "LEAD_GENERATION")
    return true
  return false
}
```

**Outputs:**
```json
{
  "groupId": "string",
  "groupName": "string",
  "campaigns": [
    {
      "id": "string",
      "urn": "urn:li:sponsoredCampaign:{id}",
      "name": "string",
      "objectiveType": "string",
      "budgetType": "DAILY | LIFETIME | DAILY_AND_LIFETIME | INHERITED",
      "dailyBudget": "number | null",
      "lifetimeBudget": "number | null",
      "budgetCurrency": "string | null",
      "bidStrategy": "MANUAL_BID | COST_CAP | MAX_DELIVERY | TARGET_COST | ENHANCED_CPC",
      "bidType": "CPC | CPM | CPV | null",
      "bidAmount": "number | null",
      "bidCap": "number | null",
      "pacingStrategy": "LIFETIME | ASAP",
      "scheduleStart": "YYYY-MM-DD",
      "scheduleEnd": "YYYY-MM-DD | null",
      "leadGenFormEnabled": "boolean",
      "groupId": "string",
      "groupName": "string",
      "groupBudgetType": "DAILY | LIFETIME | UNCAPPED",
      "groupDailyBudget": "number | null",
      "groupLifetimeBudget": "number | null",
      "groupBudgetCurrency": "string | null",
      "groupScheduleEnd": "string | null"
    }
  ]
}
```

