### WF-3d: Analytics — Brand / Video / Engagement

**Purpose:** Pulls analytics for the BRAND_VIDEO_ENGAGEMENT bucket. Primary signals are CPM, video completion rate, and engagement rate.

**API Call fields:**
```
&fields=pivotValue,dateRange,costInLocalCurrency,impressions,
        videoViews,videoFirstQuartileCompletions,videoCompletions,
        likes,comments,shares,clicks
```

**Metric normalization:**
```javascript
primaryConversions:  row.videoCompletions || 0
secondaryMetric1:    row.videoViews || 0
secondaryMetric1Key: "videoViews"
secondaryMetric2:    (row.likes || 0) + (row.comments || 0) + (row.shares || 0)
secondaryMetric2Key: "totalEngagements"
```

**Outputs:** Same schema with `objectiveBucket: "BRAND_VIDEO_ENGAGEMENT"`.

