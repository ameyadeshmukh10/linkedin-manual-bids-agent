### WF-4: Combine Analytics + Build Context Payload

**Purpose:** Stitches all WF-3 analytics results with campaign metadata from the merge layer. Rolls up daily rows to 7-day aggregates. Computes all derived metrics the analysis worker needs. Produces the final context payload.

**Inputs:**
- All WF-3 outputs (array)
- `allCampaigns` flat array (from merge layer)
- `today` timestamp

**Analytics stitch:**
```javascript
// Build lookup: campaignUrn → array of daily rows
const analyticsMap = {}
wf3Results.forEach(bucket => {
  bucket.analyticsRows.forEach(row => {
    if (!analyticsMap[row.campaignUrn]) analyticsMap[row.campaignUrn] = []
    analyticsMap[row.campaignUrn].push(row)
  })
})
```

**Derived metrics computation:**
```javascript
function computeCampaignMetrics(campaign, analyticsMap, today) {
  const rows         = analyticsMap[campaign.urn] || []
  const daysWithData = rows.filter(r => r.impressions > 0).length

  // 7-day totals
  const totalSpend       = sum(rows, 'spend')
  const totalImpressions = sum(rows, 'impressions')
  const totalClicks      = sum(rows, 'clicks')
  const totalConversions = sum(rows, 'primaryConversions')
  const avgDailySpend    = totalSpend / 7

  // Efficiency metrics — guard divide-by-zero
  const ctr = totalImpressions > 0 ? totalClicks / totalImpressions : 0
  const cpc = totalClicks      > 0 ? totalSpend  / totalClicks      : null
  const cpm = totalImpressions > 0 ? (totalSpend / totalImpressions) * 1000 : null
  const costPerConversion = totalConversions > 0 ? totalSpend / totalConversions : null

  // Daily budget signals (only if daily budget exists)
  const daysOverDailyBudget = campaign.dailyBudget
    ? rows.filter(r => r.spend >= campaign.dailyBudget * 0.95).length
    : null
  const daysUnderDelivering = campaign.dailyBudget
    ? rows.filter(r => r.impressions > 0 && r.spend < campaign.dailyBudget * 0.50).length
    : null
  const dailyBudgetUtilization = campaign.dailyBudget
    ? avgDailySpend / campaign.dailyBudget
    : null

  // Lifetime pacing (only if lifetime budget + schedule end)
  let lifetimePacingRatio          = null
  let lifetimeBudgetRemaining      = null
  let daysRemaining                = null
  let projectedTotalSpend          = null
  let onTrackToExhaustBudget       = null

  if (campaign.lifetimeBudget && campaign.scheduleEnd) {
    const totalDays    = daysBetween(campaign.scheduleStart, campaign.scheduleEnd)
    const daysElapsed  = daysBetween(campaign.scheduleStart, today)
    daysRemaining      = daysBetween(today, campaign.scheduleEnd)
    const expectedPct  = totalDays > 0 ? daysElapsed / totalDays : 0
    const actualPct    = totalSpend / campaign.lifetimeBudget
    lifetimePacingRatio          = expectedPct > 0 ? actualPct / expectedPct : null
    lifetimeBudgetRemaining      = campaign.lifetimeBudget - totalSpend
    projectedTotalSpend          = daysElapsed > 0 ? (totalSpend / daysElapsed) * totalDays : null
    onTrackToExhaustBudget       = projectedTotalSpend
      ? projectedTotalSpend >= campaign.lifetimeBudget * 0.95
      : null
  }

  // Group budget pressure flag
  const groupBudgetPressure = (
    campaign.groupBudgetType === "DAILY" && campaign.groupDailyBudget
    || campaign.groupBudgetType === "LIFETIME" && campaign.groupLifetimeBudget
  ) ? "CHECK_SIBLINGS" : "NONE"

  return {
    ...campaign,
    // Aggregates
    sevenDaySpend:         totalSpend,
    avgDailySpend,
    impressions:           totalImpressions,
    clicks:                totalClicks,
    conversions:           totalConversions,
    // Efficiency
    ctr,
    cpc,
    cpm,
    costPerConversion,
    // Daily signals
    daysWithData,
    daysOverDailyBudget,
    daysUnderDelivering,
    dailyBudgetUtilization,
    // Lifetime signals
    lifetimePacingRatio,
    lifetimeBudgetRemaining,
    daysRemaining,
    projectedTotalSpend,
    onTrackToExhaustBudget,
    // Group context
    groupBudgetPressure,
    // Raw series for context
    dailySpendSeries:      rows.map(r => ({ date: r.date, spend: r.spend, impressions: r.impressions }))
  }
}
```

**Outputs:** Single JSON array. One object per campaign. This is the direct input to AI Worker 1.

