## 4. Workflow Architecture

### WF-1: Get Campaign Groups

**Purpose:** Entry point. Fetches all active campaign groups for the account and resolves budget type at the group level.

**Trigger:** Scheduled daily job or manual invocation.

**Inputs:**
```json
{
  "accountId": "string",
  "accessToken": "string"
}
```

**API Call:**
```
GET https://api.linkedin.com/rest/adAccounts/{accountId}/adCampaignGroups
  ?q=search
  &search.status.values[0]=ACTIVE
  &search.status.values[1]=DRAFT
  &fields=id,name,status,totalBudget,dailyBudget,runSchedule,allowedCampaignTypes
  &count=100
```

**Headers:**
```
Authorization: Bearer {accessToken}
LinkedIn-Version: 202501
X-Restli-Protocol-Version: 2.0.0
```

**Pagination:** Check `paging.total` in response. If `total > 100`, repeat with `&start=100`, `&start=200` etc. until all groups retrieved.

**Budget type resolution (run before output):**
```javascript
function resolveGroupBudgetType(group) {
  if (group.dailyBudget?.amount)    return "DAILY"
  if (group.totalBudget?.amount)    return "LIFETIME"
  return "UNCAPPED"
}
```

**Outputs:**
```json
{
  "campaignGroups": [
    {
      "id": "string",
      "urn": "urn:li:sponsoredCampaignGroup:{id}",
      "name": "string",
      "status": "ACTIVE | DRAFT",
      "budgetType": "DAILY | LIFETIME | UNCAPPED",
      "dailyBudget": "number | null",
      "lifetimeBudget": "number | null",
      "budgetCurrency": "string | null",
      "scheduleStart": "YYYY-MM-DD",
      "scheduleEnd": "YYYY-MM-DD | null"
    }
  ],
  "totalCount": "number",
  "accountId": "string",
  "accessToken": "string"
}
```

**Halt condition:** If `totalCount = 0` or `campaignGroups` is empty, emit `NO_ACTIVE_GROUPS` and stop pipeline. Notify delivery layer.

---

### Batch Layer: Fan-Out per Group

**Platform:** EverWorker Batch

**Purpose:** Takes the `campaignGroups` array from WF-1 and spawns a parallel WF-2 invocation for each group. Collects all results before proceeding.

**Inputs:** Full WF-1 output object.

**Behavior:**
```javascript
// For each group in campaignGroups, invoke WF-2 with:
{
  groupId:          group.id,
  groupUrn:         group.urn,
  groupName:        group.name,
  groupBudgetType:  group.budgetType,
  groupDailyBudget: group.dailyBudget,
  groupLifetimeBudget: group.lifetimeBudget,
  groupBudgetCurrency: group.budgetCurrency,
  groupScheduleEnd: group.scheduleEnd,
  accountId:        accountId,
  accessToken:      accessToken
}
```

**Concurrency:** All WF-2 instances run in parallel. Batch layer waits for all completions (or timeouts) before passing to Merge + Route.

**Failure handling:** If a WF-2 invocation fails, log the groupId and continue. Pass partial results downstream with a `failedGroups[]` list in the merge output.

**Outputs:** Array of WF-2 result objects, one per group.

