### WF-3a: Analytics — Lead Generation

**Purpose:** Pulls 7-day daily analytics for all campaigns in the LEAD_GENERATION bucket using lead-specific conversion metrics.

**Inputs:** Route payload for LEAD_GENERATION bucket.

**API Call:**
```
GET https://api.linkedin.com/rest/adAnalytics
  ?q=analytics
  &pivot=CAMPAIGN
  &timeGranularity=DAILY
  &dateRange.start.day={startDay}
  &dateRange.start.month={startMonth}
  &dateRange.start.year={startYear}
  &dateRange.end.day={endDay}
  &dateRange.end.month={endMonth}
  &dateRange.end.year={endYear}
  &campaigns[0]=urn:li:sponsoredCampaign:{id0}
  &campaigns[1]=urn:li:sponsoredCampaign:{id1}
  ...
  &fields=pivotValue,dateRange,costInLocalCurrency,impressions,clicks,
          oneClickLeads,leadGenerationMailContactInfoShares
```

**Batching:** Max 20 campaign URNs per call. If bucket has >20 campaigns, split into batches of 20 and merge results.

**Do NOT include:** `externalWebsiteConversions` (will be zero or misleading for lead gen campaigns).

**Metric normalization:**
```javascript
// Map lead gen specific fields to normalized names
primaryConversions:  row.oneClickLeads || 0
secondaryMetric1:    row.leadGenerationMailContactInfoShares || 0
secondaryMetric1Key: "mailContactInfoShares"
```

**Outputs:**
```json
{
  "objectiveBucket": "LEAD_GENERATION",
  "analyticsRows": [
    {
      "campaignUrn": "string",
      "date": "YYYY-MM-DD",
      "spend": "number",
      "impressions": "number",
      "clicks": "number",
      "primaryConversions": "number",
      "primaryConversionKey": "oneClickLeads",
      "secondaryMetric1": "number",
      "secondaryMetric1Key": "mailContactInfoShares"
    }
  ]
}
```

