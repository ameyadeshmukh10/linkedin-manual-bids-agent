## 8. Build Guide

### Prerequisites

- LinkedIn Marketing API access with OAuth 2.0 token (scopes: `r_ads`, `r_ads_reporting`)
- EverWorker account with workflow and AI Worker capability
- Ad account ID for target LinkedIn account
- Delivery destination configured (Slack webhook, email SMTP, or Google Sheets API)

### Step 1: Configure OAuth

Store `accessToken` and `accountId` as environment variables or secrets in EverWorker. The access token must have `r_ads` and `r_ads_reporting` scopes. Refresh token handling should be implemented if token expiry is within the pipeline window.

### Step 2: Build WF-1

- HTTP GET to adCampaignGroups endpoint
- Apply `resolveGroupBudgetType()` function
- Output to Batch Layer

### Step 3: Configure Batch Layer

- Input: `campaignGroups[]` array from WF-1
- Fan-out trigger: one WF-2 per group
- Parallelism: maximum available
- Collect all results before proceeding

### Step 4: Build WF-2

- HTTP GET to adCampaigns endpoint, parameterized by `groupUrn`
- Apply `resolveCampaignBudget()` function
- Apply `resolveBidStrategy()` function
- Apply `resolveLeadGen()` function
- Join group budget fields from WF-2 input onto each campaign object
- Output campaigns array with full context

### Step 5: Configure Merge + Route Layer

- Flatten all WF-2 results into `allCampaigns[]`
- Apply `resolveBucket()` to each campaign
- Build four bucket arrays
- Route each non-empty bucket to its WF-3 variant
- Compute and attach `dateRange` (T-7 to T-1)

### Step 6: Build WF-3a through WF-3d

- One workflow per objective bucket
- Parameterize `fields` string per bucket (see analytics fields above)
- Handle >20 campaign batching within each workflow
- Normalize output to standard analyticsRow schema before returning

### Step 7: Build WF-4

- Collect all WF-3 outputs
- Build `analyticsMap` keyed by campaignUrn
- Map over `allCampaigns`, apply `computeCampaignMetrics()` for each
- Output single JSON array

### Step 8: Configure AI Worker 1

- Model: Claude Sonnet (claude-sonnet-4-20250514)
- System prompt: Role/Objective + full decision framework from Section 5
- User message: WF-4 output array + instruction to return JSON recommendations array
- Temperature: 0 (deterministic rule application)
- Max tokens: 4000 (scale up if account has >50 campaigns)
- Parse JSON response. Validate structure before passing to AI Worker 2.

### Step 9: Configure AI Worker 2

- Model: Claude Sonnet
- System prompt: Role/Objective + format specs from Section 5
- User message: AI Worker 1 output + `outputFormat` parameter + `dateRange` + `accountName`
- Temperature: 0
- Route output to delivery target based on `outputFormat`

### Step 10: Configure Delivery

- **Slack:** POST to webhook URL. Set `Content-Type: application/json`.
- **Email:** Send via SMTP or SendGrid. Use HTML email output from AI Worker 2 as body.
- **Google Sheets:** Parse JSON table output. Append rows via Sheets API. Clear previous day's data first.

### Step 11: Schedule

Set pipeline trigger to run daily at a consistent time. Recommended: 8:00 AM in the account owner's timezone. This ensures T-1 data is fully settled in LinkedIn's analytics (24–48hr lag) and the report is ready at start of business.

