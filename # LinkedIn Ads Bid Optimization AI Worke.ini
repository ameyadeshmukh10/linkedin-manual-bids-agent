## 2. Business Process

```
TRIGGER (daily schedule or manual)
  │
  ├─ Pull all active campaign groups from LinkedIn
  │   └─ For each group: pull all campaigns with bids and budgets
  │
  ├─ Resolve budget type per group (daily / lifetime / uncapped)
  ├─ Resolve budget type per campaign (daily / lifetime / both / inherited)
  ├─ Resolve bid strategy per campaign (manual / cost cap / max delivery / target cost)
  │
  ├─ Group campaigns by objective type
  ├─ For each objective bucket: pull analytics with the correct metrics for that objective
  │
  ├─ Stitch campaign metadata + analytics into a single context payload
  ├─ Compute derived metrics: utilization, pacing ratio, days over/under budget
  │
  ├─ AI Worker 1 analyzes each campaign using strategy-aware decision rules
  │   └─ Outputs structured JSON: direction, recommended value, rationale, confidence
  │
  └─ AI Worker 2 formats the recommendations into the delivery format
      └─ Delivers to Slack / email / Google Sheets
```

**Cadence:** Daily. Runs on T-1 data (LinkedIn analytics has 24–48hr lag — campaigns analyzed reflect yesterday's performance).

**Account structure supported:**
- Multiple campaign groups per account
- Multiple campaigns per group
- All LinkedIn bid strategies: Manual Bid, Cost Cap, Max Delivery, Target Cost, Enhanced CPC
- All LinkedIn budget configurations: daily, lifetime, daily+lifetime, inherited from group
- All campaign objectives: Lead Generation, Website Conversion, Website Visit, Brand Awareness, Video Views, Engagement

