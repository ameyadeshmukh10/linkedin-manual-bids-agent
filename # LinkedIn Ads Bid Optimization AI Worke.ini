## 6. Data Schemas Reference

### LinkedIn Budget Configuration Matrix

| budgetType | dailyBudget | lifetimeBudget | Applies at |
|---|---|---|---|
| DAILY | ✓ | null | Campaign |
| LIFETIME | null | ✓ | Campaign |
| DAILY_AND_LIFETIME | ✓ | ✓ | Campaign |
| INHERITED | null | null | Campaign (group controls) |
| DAILY (group) | ✓ | null | Group |
| LIFETIME (group) | null | ✓ | Group |
| UNCAPPED | null | null | Group |

### LinkedIn Bid Strategy Matrix

| bidStrategy | adjustmentTarget | currentValue | Can Adjust? | Underdelivery Signal |
|---|---|---|---|---|
| MANUAL_BID | bidAmount | bidAmount | Yes | Bid below auction floor |
| COST_CAP | bidCap | bidCap | Yes | Cap below clearing price |
| TARGET_COST | bidCap | bidCap | Yes | Target below clearing price |
| ENHANCED_CPC | bidAmount | bidAmount | Yes | Bid below auction floor |
| MAX_DELIVERY | null | null | No | Budget / audience / creative |

### Objective to Analytics Metric Map

| objectiveType | Bucket | primaryConversions | Do Not Use |
|---|---|---|---|
| LEAD_GENERATION | LEAD_GENERATION | oneClickLeads | externalWebsiteConversions |
| WEBSITE_CONVERSION | WEBSITE_CONVERSION | externalWebsiteConversions | oneClickLeads |
| WEBSITE_VISIT | WEBSITE_VISIT | (none) | conversion metrics |
| BRAND_AWARENESS | BRAND_VIDEO_ENGAGEMENT | videoCompletions | CPC, conversion metrics |
| VIDEO_VIEWS | BRAND_VIDEO_ENGAGEMENT | videoCompletions | CPC, conversion metrics |
| ENGAGEMENT | BRAND_VIDEO_ENGAGEMENT | (engagements) | CPC, conversion metrics |
| JOB_APPLICANTS | WEBSITE_CONVERSION | externalWebsiteConversions | oneClickLeads |

### Bid Floor Reference

| bidType | Minimum Recommended Bid |
|---|---|
| CPC | $3.50 |
| CPM | $2.00 |
| CPV | $0.01 |

*LinkedIn's actual auction floors vary by audience, geography, and competition. These are conservative minimums for recommendation capping only.*

