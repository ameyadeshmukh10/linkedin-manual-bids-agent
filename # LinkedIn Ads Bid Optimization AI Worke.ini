### Merge + Route Layer

**Platform:** EverWorker

**Purpose:** Collects all parallel WF-2 outputs, flattens into a single campaigns array, resolves objective buckets, and routes each bucket to the appropriate analytics workflow.

**Inputs:** Array of all WF-2 output objects.

**Merge logic:**
```javascript
const allCampaigns = wf2Results.flatMap(r => r.campaigns)
```

**Objective bucket mapping:**
```javascript
function resolveBucket(objectiveType) {
  const map = {
    "LEAD_GENERATION":               "LEAD_GENERATION",
    "WEBSITE_CONVERSION":            "WEBSITE_CONVERSION",
    "WEBSITE_VISIT":                 "WEBSITE_VISIT",
    "BRAND_AWARENESS":               "BRAND_VIDEO_ENGAGEMENT",
    "VIDEO_VIEWS":                   "BRAND_VIDEO_ENGAGEMENT",
    "ENGAGEMENT":                    "BRAND_VIDEO_ENGAGEMENT",
    "JOB_APPLICANTS":                "WEBSITE_CONVERSION"
  }
  return map[objectiveType] || "WEBSITE_VISIT"  // safe default
}

const buckets = {
  LEAD_GENERATION:       [],
  WEBSITE_CONVERSION:    [],
  WEBSITE_VISIT:         [],
  BRAND_VIDEO_ENGAGEMENT: []
}

allCampaigns.forEach(c => {
  buckets[resolveBucket(c.objectiveType)].push(c)
})
```

**Routing:** Each non-empty bucket triggers its analytics workflow. Empty buckets are skipped. All four WF-3 variants run in parallel.

**Outputs per route:**
```json
{
  "objectiveBucket": "string",
  "campaigns": ["array of campaign objects for this bucket"],
  "campaignUrns": ["urn:li:sponsoredCampaign:xxx", "..."],
  "dateRange": {
    "startDay": "number", "startMonth": "number", "startYear": "number",
    "endDay": "number",   "endMonth": "number",   "endYear": "number"
  },
  "accessToken": "string"
}
```

**Date range computation:** Always T-7 to T-1. Build at runtime:
```javascript
const today    = new Date()
const end      = new Date(today); end.setDate(end.getDate() - 1)
const start    = new Date(today); start.setDate(start.getDate() - 7)
```

