## 7. Error Handling & Edge Cases

### API Failures

| Scenario | Handling |
|---|---|
| WF-1 returns empty groups | Halt pipeline. Emit NO_ACTIVE_GROUPS to delivery. |
| WF-2 fails for one group | Log groupId in failedGroups[]. Continue with remaining groups. |
| WF-3 analytics call fails | Log bucket. Pass campaigns with empty analytics rows. AI Worker 1 will HOLD them (daysWithData = 0 < 3). |
| LinkedIn API rate limit (429) | Retry after 60s. Max 3 retries. If still failing, log and skip. |
| LinkedIn API auth failure (401) | Halt pipeline. Emit AUTH_FAILURE to delivery. Do not retry. |

### Data Edge Cases

| Scenario | Handling |
|---|---|
| Campaign with no schedule end | lifetimePacingRatio = null. Skip all lifetime pacing rules. |
| Campaign with INHERITED budget and UNCAPPED group | groupBudgetPressure = "NONE". Normal analysis. |
| Campaign group with no budget (UNCAPPED) | Pass groupBudgetType: "UNCAPPED". AI Worker 1 ignores group budget constraints. |
| Analytics returns 0 impressions for all days | daysWithData = 0. AI Worker 1 fires Step 0 HOLD. |
| Campaign with both dailyBudget and lifetimeBudget | budgetType = "DAILY_AND_LIFETIME". Compute both daily utilization and lifetime pacing. Apply both constraint gates. |
| leadGenerationFormEnabled field absent from API | Infer from objectiveType === "LEAD_GENERATION". Flag as inferred in campaign object. |
| Analytics bucket has >20 campaigns | Split into batches of 20 URNs. Make multiple API calls. Merge rows before passing to WF-4. |

