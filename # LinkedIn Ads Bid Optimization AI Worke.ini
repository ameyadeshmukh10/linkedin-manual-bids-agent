## 1. What This Solution Does

This solution is a LinkedIn Ads Bid optimization AI Worker. It connects to the LinkedIn Marketing API, pulls the full hierarchy of campaign groups, campaigns, bids, budgets, and performance analytics, analyzes spend efficiency and delivery against each campaign's specific objective and bid strategy, and produces structured bid adjustment recommendations and a formatted report — all without human intervention.

**It replaces:**
- Manual account reviews in LinkedIn Campaign Manager
- Spreadsheet-based spend tracking
- Ad-hoc bid adjustment decisions made from memory or gut feel

**It produces:**
- A complete snapshot of every active campaign: budget settings, bid strategy, and 7-day performance
- Structured bid recommendations per campaign, with specific numeric rationale
- A human-readable report grouped by action priority, delivered to Slack, email, or Google Sheets
- Escalation flags for campaigns where the issue is not bid-related (creative, audience, landing page)

**What it does not do:**
- Apply bid changes automatically (recommendations only — human executes)
- Manage creative or audience targeting
- Access LinkedIn data outside the authorized ad account

